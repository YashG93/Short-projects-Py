
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 96%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .add-money {
            background-color: #28a745;
        }
        .add-money:hover {
            background-color: #218838;
        }
        .add-expense {
            background-color: #dc3545;
        }
        .add-expense:hover {
            background-color: #c82333;
        }
        .total-balance {
            background-color: #007bff;
        }
        .total-balance:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 12px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 6px;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            background-color: #ffebee;
            color: #c62828;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Expense Manager</h1>
    <form method="POST">

        <input
            type="number"
            name="amount"
            placeholder="Enter amount"
            step="0.01"
        >

        <div class="buttons">

            <button
                type="submit"
                name="command"
                value="add_amount"
                class="add-money">
                Add Money
            </button>

            <button
                type="submit"
                name="command"
                value="add_exp"
                class="add-expense">
                Add Expense
            </button>

            <button
                type="submit"
                name="command"
                value="total_bal"
                class="total-balance">
                Total Balance
            </button>
        </div>
    </form>

    {% if result is not none %}
        <div class="result">
            <strong>Result:</strong>
            {{ result }}
        </div>
    {% endif %}

    {% if exception %}
        <div class="error">
            {{ exception }}
        </div>
    {% endif %}

</div>
</body>
</html>
